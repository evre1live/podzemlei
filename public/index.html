  <!-- главное меню: название, первый кадр фона и рама панелей — только если открыта главная, а не ссылка на комнату.
       Адреса совпадают с MENU в app.js (проверяет test/rules.js) -->
  <script>
    if (!/[?&](room|watch)=/.test(location.search)) [
      ['/ui/v4/title.webp?v=f7196a8c', '/ui/v4/title.webp?v=f7196a8c 1000w, /ui/v4/title@2x.webp?v=063c5828 2000w', '(max-width: 1100px) 92vw, 1000px'],
      ['/ui/v4/menu-poster.webp?v=8fe4b431', '/ui/v4/menu-poster-720.webp?v=3660a312 1280w, /ui/v4/menu-poster.webp?v=8fe4b431 1920w', 'max(100vw, 178vh)'],
      ['/ui/table/v2/frame-steel.webp'],
    ].forEach(([href, set, sizes]) => {
      const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = href;
      if (set) { l.setAttribute('imagesrcset', set); l.setAttribute('imagesizes', sizes); }
      document.head.append(l);
    });
  </script>

  <style>
    #splash { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; transition: opacity .7s ease, visibility 0s linear .7s;

    #splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .sp-in { display: grid; justify-items: center; translate: 0 -4vh; }
    #splash svg { width: 86px; height: 86px; animation: spGlow 2.2s ease-in-out infinite alternate; }
    #splash .sp-t { margin-top: 14px; font: 700 clamp(36px, 7vw, 58px)/1 'Cormorant SC', Georgia, serif; letter-spacing: .06em; color: #e6c27a;
      background: linear-gradient(180deg, #fff1cc 0%, #e6c27a 40%, #b0843a 64%, #e6be74 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 #000) drop-shadow(0 8px 22px rgba(0, 0, 0, .8)); }
    #splash .sp-bar { position: relative; width: 190px; height: 3px; margin-top: 24px; border-radius: 3px; overflow: hidden; background: rgba(255, 214, 140, .12); }
    #splash .sp-bar i { position: absolute; inset: 0 auto 0 0; width: 38%; background: linear-gradient(90deg, transparent, #f2c27a, #fff0c8, #f2c27a, transparent); animation: spRun 1.25s ease-in-out infinite; }
    #splash .sp-e { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: #ffc46b; box-shadow: 0 0 8px 2px rgba(255, 160, 70, .7); opacity: 0; animation: spEmber 3.2s linear infinite; }
    @keyframes spRun { from { transform: translateX(-110%); } to { transform: translateX(270%); } }
    @keyframes spGlow { from { filter: drop-shadow(0 0 8px rgba(255, 160, 70, .28)); } to { filter: drop-shadow(0 0 26px rgba(255, 170, 80, .62)); } }
    @keyframes spEmber { 0% { opacity: 0; transform: translate(var(--x), 60px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(var(--x) * 1.6), -220px); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash svg { animation: none !important; } }
  </style>
