# Пример для nginx на VPS. Замените game.example.uz на свой домен.
# Положите файл в /etc/nginx/sites-available/podzemlei, включите ссылкой в sites-enabled
# и получите сертификат: sudo certbot --nginx -d game.example.uz

server {
    listen 80;
    server_name game.example.uz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # без этих двух строк не заработают WebSocket и игра будет «отваливаться»
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # партия может идти часами — не рвём долгие соединения
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
